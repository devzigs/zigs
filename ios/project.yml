name: Zigs
options:
  bundleIdPrefix: app.zigs
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Zigs:
    type: application
    platform: iOS
    sources: [Zigs]
    dependencies:
      - framework: ZigsCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zigs.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zigs
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: Zigs asks for Face ID to unlock your key shares.
        OTHER_LDFLAGS: -lc++
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        CODE_SIGN_STYLE: Automatic
    info:
      path: Zigs/Info.plist
      properties:
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: app.zigs.invite
            CFBundleURLSchemes: [zigs]
  ZigsMac:
    type: application
    platform: macOS
    sources:
      - path: Zigs
        excludes: [Info.plist]
    dependencies:
      - framework: ZigsCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: Zigs
        PRODUCT_BUNDLE_IDENTIFIER: app.zigs.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zigs
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS: -lc++
        # Ad-hoc signed for local testing; a public DMG needs Developer ID signing and notarization.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    info:
      path: Mac/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: app.zigs.invite
            CFBundleURLSchemes: [zigs]
