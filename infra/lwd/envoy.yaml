# A template: envoy-start.sh puts the secret LWD_KEY in place of the placeholder of the route
# matcher, and starts Envoy on the result. Envoy must never read this file as it is.
# tunnel (8080): the Cloudflare tunnel sends lwd.zigs.app here. A request needs the header
#   x-zigs-lwd-key, and only the app Worker has the key. Any other request matches no route and
#   gets 404. Before the call to lightwalletd, Envoy removes that header and the headers that
#   Cloudflare adds with the IP address and country of the visitor. Envoy keeps no access log.
#   No CORS: no browser calls this listener.
# tailnet (8081): no key, for devices on the tailnet and local runs. CORS names the app origins.
static_resources:
  listeners:
    - name: tunnel
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: tunnel
                stream_idle_timeout: 0s
                route_config:
                  virtual_hosts:
                    - name: lwd
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/cash.z.wallet.sdk.rpc.CompactTxStreamer/"
                            headers:
                              - name: x-zigs-lwd-key
                                string_match: { exact: "__LWD_KEY__" }
                          route: { cluster: lightwalletd, timeout: 0s }
                          request_headers_to_remove:
                            - x-zigs-lwd-key
                            - cf-connecting-ip
                            - cf-connecting-ipv6
                            - cf-pseudo-ipv4
                            - cf-ipcountry
                            - cf-ray
                            - true-client-ip
                            - x-forwarded-for
                            - x-real-ip
                            - forwarded
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: tailnet
      address:
        socket_address: { address: 0.0.0.0, port_value: 8081 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: tailnet
                stream_idle_timeout: 0s
                route_config:
                  virtual_hosts:
                    - name: lwd
                      domains: ["*"]
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match: [{ safe_regex: { regex: "^https://app\\.zigs\\.app$|^http://localhost(:[0-9]+)?$" } }]
                          allow_methods: "POST, OPTIONS"
                          allow_headers: "content-type,x-grpc-web,x-user-agent,grpc-timeout,keep-alive,user-agent,cache-control"
                          expose_headers: "grpc-status,grpc-message"
                          max_age: "1728000"
                      routes:
                        - match: { prefix: "/cash.z.wallet.sdk.rpc.CompactTxStreamer/" }
                          route: { cluster: lightwalletd, timeout: 0s }
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: lightwalletd
      type: STRICT_DNS
      connect_timeout: 5s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: lightwalletd
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: lightwalletd, port_value: 9067 }
