[package]
name = "zec-frost"
version = "0.1.0"
edition = "2021"
description = "Prototype: t-of-n FROST multisig wallet for Zcash Orchard"

[dependencies]
reddsa = { git = "https://github.com/ZcashFoundation/reddsa.git", rev = "ed49e9ca0699a6450f6d4a9fe62ff168f5ea1ead", features = ["frost", "serde"] }
frost-rerandomized = { version = "2.1.0", features = ["serde"] }
orchard = { version = "0.15.5", features = ["unstable-frost"] }
pczt = { version = "0.8.0-rc.1", features = ["signer", "orchard", "prover", "io-finalizer", "spend-finalizer", "tx-extractor", "zcp-builder"] }
zcash_primitives = "0.29.0"
zcash_proofs = "0.29.0"
zcash_protocol = { version = "0.10.0", features = ["local-consensus"] }
zcash_keys = { version = "0.15.0", features = ["orchard", "unstable-frost"] }
zcash_address = "0.13.0"
zcash_transparent = "0.9.0"
halo2_proofs = "0.3.2"
incrementalmerkletree = "0.8"
shardtree = "0.7"
zcash_note_encryption = "0.4"
zip32 = "0.2"
rand = "0.8.5"
rand_core = "0.6.4"
hex = "0.4.3"
group = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
