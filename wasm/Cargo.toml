[package]
name = "zec-frost-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser build of the zec-frost prototype (WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
reddsa = { git = "https://github.com/ZcashFoundation/reddsa.git", rev = "ed49e9ca0699a6450f6d4a9fe62ff168f5ea1ead", features = ["frost", "serde"] }
frost-rerandomized = { version = "2.1.0", features = ["serde"] }
orchard = { version = "0.15.5", default-features = false, features = ["std", "circuit", "unstable-frost"] }
pczt = { version = "0.8.0-rc.1", features = ["signer", "orchard", "prover", "io-finalizer", "spend-finalizer", "tx-extractor", "zcp-builder"] }
zcash_primitives = { version = "0.29.0", default-features = false, features = ["std", "circuits"] }
zcash_protocol = { version = "0.10.0", features = ["local-consensus"] }
zcash_keys = { version = "0.15.0", features = ["orchard", "unstable-frost"] }
incrementalmerkletree = "0.8"
shardtree = "0.7"
zcash_note_encryption = "0.4"
group = "0.13"
rand = "0.8.5"
rand_core = "0.6.4"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
blake2b_simd = "1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
