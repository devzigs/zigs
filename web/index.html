<style>
/* Layout: app shell. Fixed sidebar (wallets, engine status) + one working column per wallet:
   page header, tabs, cards. Payments open in a right drawer; Send and Create open as dialogs.
   Dark-first; a light palette applies when the viewer prefers light. */
:root {
  color-scheme: dark;
  --bg: #0b0b10;
  --side: #0e0e14;
  --panel: #13131a;
  --raised: #1a1a23;
  --sunk: #0f0f15;
  --line: #24242f;
  --line-2: #30303d;
  --text: #ededf2;
  --muted: #9a9aab;
  --faint: #6c6c7d;
  --accent: #f4b728;
  --accent-text: #f4b728;
  --on-accent: #17130a;
  --accent-soft: rgba(244, 183, 40, 0.12);
  --ok: #4ccb8f;
  --ok-soft: rgba(76, 203, 143, 0.12);
  --bad: #ff7b72;
  --bad-soft: rgba(255, 123, 114, 0.12);
  --info: #8ab4ff;
  --info-soft: rgba(138, 180, 255, 0.12);
  --shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.8);
  --sans: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f6f6f8; --side: #fbfbfc; --panel: #ffffff; --raised: #f3f3f6; --sunk: #f0f0f4;
    --line: #e4e4ea; --line-2: #d4d4dd; --text: #15151c; --muted: #5d5d6e; --faint: #8a8a99;
    --accent-text: #8a6200; --accent-soft: rgba(244, 183, 40, 0.18);
    --ok: #12804f; --ok-soft: rgba(18, 128, 79, 0.1); --bad: #c0362c; --bad-soft: rgba(192, 54, 44, 0.08);
    --info: #2d5fc4; --info-soft: rgba(45, 95, 196, 0.08); --shadow: 0 24px 60px -28px rgba(20, 20, 40, 0.35);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f6f8; --side: #fbfbfc; --panel: #ffffff; --raised: #f3f3f6; --sunk: #f0f0f4;
  --line: #e4e4ea; --line-2: #d4d4dd; --text: #15151c; --muted: #5d5d6e; --faint: #8a8a99;
  --accent-text: #8a6200; --accent-soft: rgba(244, 183, 40, 0.18);
  --ok: #12804f; --ok-soft: rgba(18, 128, 79, 0.1); --bad: #c0362c; --bad-soft: rgba(192, 54, 44, 0.08);
  --info: #2d5fc4; --info-soft: rgba(45, 95, 196, 0.08); --shadow: 0 24px 60px -28px rgba(20, 20, 40, 0.35);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 14.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent-text); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.mono, .hex { font-family: var(--mono); font-size: 12.5px; }
.hex { word-break: break-all; }
.label { font: 500 11.5px/1.2 var(--mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--faint); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Shell */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; padding: 18px 14px; background: var(--side); border-right: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px; font-weight: 600; font-size: 16px; letter-spacing: -0.02em; text-decoration: none; color: var(--text); }
.logo svg { width: 24px; height: 24px; flex: none; }
.net { margin-left: auto; font: 500 10.5px/1 var(--mono); padding: 4px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent-text); text-transform: uppercase; letter-spacing: 0.06em; }
#side-nav { display: grid; gap: 2px; align-content: start; overflow: auto; flex: 1; }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 8px; }
.side-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; color: var(--muted); }
.side-item:hover { background: var(--raised); color: var(--text); }
.side-item.active { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.side-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.side-meta { font: 400 11.5px/1 var(--mono); color: var(--faint); }
.side-empty { padding: 6px 8px; color: var(--faint); font-size: 13px; }
.side-foot { display: grid; gap: 10px; border-top: 1px solid var(--line); padding: 14px 8px 0; }
.engine { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.dot.bad { background: var(--bad); }
.dot.busy { background: var(--accent); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
.side-note { font-size: 11.5px; color: var(--faint); line-height: 1.5; }
.main { min-width: 0; padding: 28px clamp(16px, 4vw, 48px) 64px; }
.page { max-width: 1040px; margin-inline: auto; display: grid; gap: 22px; }

/* Avatars */
.av { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; font: 600 11px/1 var(--sans); background: var(--raised); color: var(--muted); border: 1px solid var(--line); }
.av.round { border-radius: 50%; }
.av.lg { width: 36px; height: 36px; font-size: 12.5px; }
.av.me { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
.stack { display: flex; }
.stack .av { margin-left: -8px; box-shadow: 0 0 0 2px var(--bg); }
.stack .av:first-child { margin-left: 0; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding-inline: 14px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel); color: var(--text); font: 500 13.5px/1 var(--sans); cursor: pointer; white-space: nowrap; text-decoration: none; transition: background 0.15s, border-color 0.15s; }
.btn:hover { background: var(--raised); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--raised); }
.btn.sm { height: 30px; padding-inline: 10px; font-size: 12.5px; border-radius: 8px; }
.btn.lg { height: 44px; padding-inline: 18px; font-size: 14.5px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
.icon-btn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; }
.icon-btn:hover { color: var(--text); background: var(--raised); }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding-inline: 8px; border-radius: 999px; font: 500 12px/1 var(--sans); background: var(--raised); color: var(--muted); white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.9; }
.badge.plain::before { display: none; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--accent-soft); color: var(--accent-text); }
.badge.info { background: var(--info-soft); color: var(--info); }

/* Page header and tabs */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.ph-left { display: grid; gap: 8px; min-width: 0; }
.ph-left h1 { font-size: 26px; line-height: 1.15; }
.ph-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.ph-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.back { display: none; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { position: relative; border: 0; background: none; padding: 10px 12px 12px; color: var(--muted); font-weight: 500; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.tab .count { margin-left: 6px; font: 500 11px/1 var(--mono); padding: 2px 6px; border-radius: 6px; background: var(--raised); color: var(--muted); }

/* Cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card-pad { padding: 20px; display: grid; gap: 14px; align-content: start; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card-head h2 { font-size: 15px; letter-spacing: -0.01em; }
.grid-ov { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }

/* Money */
.money { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; white-space: nowrap; }
.money .dec { color: var(--muted); }
.money .cur { color: var(--faint); font-weight: 500; margin-left: 0.3em; font-size: 0.55em; letter-spacing: 0; }
.money.xl { font-size: clamp(34px, 5vw, 46px); font-weight: 600; line-height: 1; }
.money.lg { font-size: 30px; font-weight: 600; line-height: 1; }
.money.md { font-size: 15px; font-weight: 500; }
.money.md .cur { font-size: 0.8em; }
.balance { background: radial-gradient(120% 140% at 100% 0%, var(--accent-soft), transparent 55%), var(--panel); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.stats > div { background: var(--panel); padding: 12px 14px; display: grid; gap: 4px; }
.sync { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.sync > span { display: inline-flex; align-items: center; gap: 8px; }
.progress { height: 4px; border-radius: 999px; background: var(--raised); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width 0.3s; }
.addr-box { min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line); }
.addr-box .hex { flex: 1; min-width: 0; color: var(--muted); }
.addr-full { font-family: var(--mono); font-size: 12px; word-break: break-all; color: var(--muted); padding: 12px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line); }

/* Lists and tables */
.list { display: grid; }
.row-item { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 12px 20px; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: left; cursor: pointer; color: var(--text); }
.row-item:first-child { border-top: 0; }
.row-item:hover { background: var(--raised); }
.row-item[aria-current="true"] { background: var(--raised); }
.ri-main { display: grid; gap: 2px; min-width: 0; }
.ri-title { font-weight: 500; }
.ri-sub { font-size: 12.5px; color: var(--faint); }
.tx-ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--raised); color: var(--muted); font-size: 15px; }
.chev { color: var(--faint); }
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table th { text-align: left; font: 500 11.5px/1.2 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--raised); }
.table td { padding: 13px 20px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr { cursor: pointer; }
.table tbody tr:hover td { background: var(--raised); }
.table .num { text-align: right; }
.scroll { overflow-x: auto; }
.empty { padding: 36px 20px; text-align: center; display: grid; gap: 8px; justify-items: center; color: var(--muted); }
.empty h3 { color: var(--text); font-size: 15px; }

/* Members */
.member { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--line); }
.member:first-child { border-top: 0; }
.member .ri-title { display: flex; align-items: center; gap: 8px; }
.you { font: 500 11px/1 var(--mono); padding: 3px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent-text); }
.m-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

/* Setup */
.setup { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.steps { display: grid; }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 20px; }
.step:last-child { padding-bottom: 0; }
.step::before { content: ""; position: absolute; left: 13px; top: 30px; bottom: 2px; width: 2px; background: var(--line); }
.step:last-child::before { display: none; }
.step.done::before { background: var(--ok); }
.tick { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 12px/1 var(--mono); border: 2px solid var(--line-2); color: var(--faint); background: var(--panel); position: relative; z-index: 1; }
.step.done .tick { background: var(--ok); border-color: var(--ok); color: var(--panel); }
.step.now .tick { border-color: var(--accent); color: var(--accent-text); box-shadow: 0 0 0 4px var(--accent-soft); }
.step.bad .tick { background: var(--bad); border-color: var(--bad); color: var(--panel); }
.step h3 { font-size: 14.5px; letter-spacing: -0.01em; padding-top: 4px; }
.step p { color: var(--muted); font-size: 13px; }
.seat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.seat { padding: 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunk); display: grid; gap: 10px; justify-items: start; }
.seat.mine { border-color: rgba(244, 183, 40, 0.5); }
.seat.open { border-style: dashed; background: transparent; }

/* Drawer and dialogs */
.scrim { position: fixed; inset: 0; background: rgba(5, 5, 10, 0.55); backdrop-filter: blur(2px); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); z-index: 41; background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); }
.drawer-body { overflow: auto; padding: 22px 20px 32px; display: grid; gap: 22px; align-content: start; }
.dialog { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; display: grid; gap: 18px; }
.dialog h2 { font-size: 18px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 500; color: var(--muted); }
.input { width: 100%; height: 42px; padding-inline: 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--sunk); color: var(--text); font: 400 14.5px var(--sans); }
.input.mono { font-family: var(--mono); font-size: 13px; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input-wrap { position: relative; }
.input-wrap .btn { position: absolute; right: 6px; top: 6px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.summary { display: grid; gap: 8px; padding: 14px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line); font-size: 13px; }
.summary div { display: flex; justify-content: space-between; gap: 12px; }
.summary dd, .summary span:last-child { font-variant-numeric: tabular-nums; }
.callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; font-size: 13px; background: var(--info-soft); color: var(--info); }
.callout.warn { background: var(--accent-soft); color: var(--accent-text); }
.callout.bad { background: var(--bad-soft); color: var(--bad); }
.callout.ok { background: var(--ok-soft); color: var(--ok); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
.lines { display: grid; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.lines > div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line); font-size: 13.5px; }
.lines > div:first-child { border-top: 0; }
.lines .neg { color: var(--muted); }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px 18px; margin: 0; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
details > summary { cursor: pointer; color: var(--accent-text); font-weight: 500; font-size: 13px; }
.log { font-family: var(--mono); font-size: 11.5px; color: var(--muted); max-height: 220px; overflow: auto; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 12px; white-space: pre-wrap; margin-top: 10px; }

/* Toast */
#banner { position: fixed; z-index: 60; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(560px, calc(100% - 32px)); padding: 12px 16px; border-radius: 12px; font-size: 13.5px; box-shadow: var(--shadow); border: 1px solid var(--line); background: var(--panel); color: var(--text); }
#banner.bad { border-color: var(--bad); color: var(--bad); }
#banner.ok { border-color: var(--ok); color: var(--ok); }

@media (max-width: 960px) {
  .grid-ov, .setup { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); border-right: 0; border-bottom: 1px solid var(--line); }
  #side-nav, .side-foot .side-note { display: none; }
  .side-foot { border: 0; padding: 0; margin-left: auto; }

<script type="module">
// ───────────────────────── Engine (WASM) ─────────────────────────
let Z = null;
const engineDot = document.getElementById("engine-dot");
const engineText = document.getElementById("engine-text");
function setEngine(state, text) { engineDot.className = "dot " + state; engineText.textContent = text; }

async function loadEngine() {
  try {
    const mod = await import("./pkg/zec_frost_wasm.js");
    await mod.default();
    Z = mod;
    setEngine("ok", "Crypto engine ready (WebAssembly)");
  } catch (e) {
    setEngine("bad", "Crypto engine failed to load");
    showBanner("bad", "The WebAssembly engine did not load: " + (e && e.message ? e.message : e) + ". Try a current Chrome, Edge, Firefox or Safari.");
  }
  render(); react();
}
const J = (s) => JSON.parse(s);
const S = (o) => JSON.stringify(o);

// Slow step (proof) in a worker, with main-thread fallback.
let worker = null, workerSeq = 0; const workerWait = new Map();
function finalizeOffThread(signedPczt) {
  try {
    if (!worker) {
      worker = new Worker(new URL("./worker.js", location.href), { type: "module" });
      worker.onmessage = (ev) => { const w = workerWait.get(ev.data.id); if (w) { workerWait.delete(ev.data.id); ev.data.ok ? w.res(ev.data.out) : w.rej(new Error(ev.data.error)); } };
      worker.onerror = (ev) => { for (const w of workerWait.values()) w.rej(new Error("worker failed: " + (ev.message || "unknown"))); workerWait.clear(); worker = null; };
    }
    const id = ++workerSeq;
    return new Promise((res, rej) => { workerWait.set(id, { res, rej }); worker.postMessage({ id, signedPczt }); });
  } catch {
    return new Promise((res, rej) => setTimeout(() => { try { const t0 = performance.now(); const o = J(Z.finalize(signedPczt)); o.ms = Math.round(performance.now() - t0); res(o); } catch (e) { rej(e); } }, 50));
  }
}

// ───────────────────────── Local secrets ─────────────────────────
// Key shares, DKG secrets and signing nonces never leave this browser.
const mem = {};
let storageOk = true;
function loadSecrets() { try { return JSON.parse(localStorage.getItem("zf-secrets") || "{}"); } catch { storageOk = false; return mem; } }
let secrets = loadSecrets();
function saveSecrets() { try { localStorage.setItem("zf-secrets", JSON.stringify(secrets)); } catch { storageOk = false; } }
const skey = (gid, seat) => gid + ":" + seat;
function mySeatSecrets(gid) { return Object.entries(secrets).filter(([k]) => k.startsWith(gid + ":")).map(([k, v]) => [Number(k.split(":")[1]), v]); }
function sec(gid, seat) { return secrets[skey(gid, seat)]; }
function putSec(gid, seat, patch) { secrets[skey(gid, seat)] = Object.assign(secrets[skey(gid, seat)] || {}, patch); saveSecrets(); }

// ───────────────────────── Platform ─────────────────────────
let db = null, sdb = null, user = null, downloads = null, me = null, canWrite = null, dbReady = false;
// Own node first; ChainSafe's public proxy is the backup.
const LIGHTWALLETDS = ["https://lwd.zigs.app", "https://zcash-testnet.chainsafe.dev"];
const SERVER_TIMEOUT_MS = 8000;
const EXPLORER_TX = "https://testnet.zcashexplorer.app/transactions/";
let chain = null;   // { gid, cw, prog, bal, ms, error, syncing } for the open group
const state = { groups: [], gid: null, g: null, seats: {}, dkg1: {}, dkg2: {}, done: {}, verify: {}, wallet: null, sessions: [], sid: null, commits: {}, shares: {}, log: [] };
let unsubGroup = [], unsubSession = [];
const busy = new Set();
const inspectCache = new Map();
let banner = null;

function showBanner(kind, text) { banner = { kind, text }; const b = document.getElementById("banner"); b.hidden = false; b.className = "notice " + kind; b.textContent = text; }
function log(msg) { state.log.unshift(new Date().toLocaleTimeString() + "  " + msg); state.log.length = Math.min(state.log.length, 60); }

// ───────────────────────── Encrypted store ─────────────────────────
// Every field under groups/{gid} is sealed with the group secret. The secret lives in the invite
// link fragment and in this browser; the server sees paths and field names only.
let gkeys = {};
try { gkeys = JSON.parse(localStorage.getItem("zf-keys") || "{}"); } catch { storageOk = false; }
function putKey(gid, key) { gkeys[gid] = key; try { localStorage.setItem("zf-keys", JSON.stringify(gkeys)); } catch { storageOk = false; } }
function adoptInviteKey() {
  const [gid, key] = location.hash.slice(1).split(".");
  if (!key) return;
  if (/^[\w-]{43}$/.test(key)) putKey(gid, key);
  try { history.replaceState(null, "", "#" + gid); } catch {}
}
const inviteLink = (gid) => location.href.split("#")[0] + "#" + gid + "." + gkeys[gid];
const keyOf = (path) => gkeys[path.split("/")[1]];

function sealDoc(path, data) {
  const out = {};
  for (const [k, v] of Object.entries(data)) if (v !== undefined) out[k] = Z.secretSeal(keyOf(path), path + "\n" + k, S(v));
  return out;
}
// ponytail: every snapshot decrypts the whole group again; cache by ciphertext if stores grow.
function openDoc(path, raw) {
  if (!Z || !keyOf(path) || raw == null) return null;
  const out = {}; let ok = 0;
  for (const [k, v] of Object.entries(raw)) {
    try { out[k] = J(Z.secretOpen(keyOf(path), path + "\n" + k, v)); ok++; }
    catch (e) { log("dropped undecryptable field " + k + " of " + path); }
  }
  return ok || !Object.keys(raw).length ? out : null;
}
function openSnap(path, snap) {
  const data = snap.exists ? openDoc(path, snap.data()) : null;
  return { id: snap.id, exists: data != null, data: () => data, metadata: snap.metadata };
}
function wrapDoc(ref) {
  return {
    id: ref.id, path: ref.path,
    get: async () => openSnap(ref.path, await ref.get()),
    set: (d) => ref.set(sealDoc(ref.path, d)),
    update: (d) => ref.update(sealDoc(ref.path, d)),
    acquire: (o) => ref.acquire(o),
    onSnapshot: (next, err) => ref.onSnapshot((s) => next(openSnap(ref.path, s)), err),
  };
}
function wrapStore(raw) {
  return {
    doc: (path) => wrapDoc(raw.doc(path)),
    collection: (path) => ({
      doc: (id) => wrapDoc(raw.collection(path).doc(id)),
      onSnapshot: (next, err) => raw.collection(path).onSnapshot((snap) => {
        const docs = snap.docs.map((d) => openSnap(path + "/" + d.id, d)).filter((d) => d.exists);
        next({ docs, size: docs.length, empty: docs.length === 0 });
      }, err),
    }),
  };
}

async function boot() {
  const [dbNs, userNs, dlNs] = await Promise.all([zigs.use("db"), zigs.use("user"), zigs.use("downloads")]);
  db = dbNs; user = userNs; downloads = dlNs;
  if (db) sdb = wrapStore(db);
  if (user) { me = await user.id(); canWrite = await user.can("data.write"); }
  if (!db) { showBanner("bad", "The group server is not available. Reload the page, or try again later."); return; }
  if (!me) showBanner("bad", "This browser cannot tell who you are, so you cannot take a seat.");
  if (canWrite === false) showBanner("bad", "You can view this page but not take part. Ask the owner to invite you as an Editor from the Share menu.");
  if (!storageOk) showBanner("bad", "This browser does not let the page save your key share. Keep this tab open, and use Back up.");
  sdb.collection("groups").onSnapshot((snap) => {
    dbReady = true;
    state.groups = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    if (state.gid && !state.g) openGroup(state.gid);
    render();
  }, (e) => showBanner("bad", "Lost connection to the shared store (" + e.code + "). Reload the page."));
  const h = location.hash.replace("#", "");
  if (h && !gkeys[h]) showBanner("bad", "This link is missing its key. Ask for the full invite link.");
  else if (h) openGroup(h);
  render();
}

function sub(path, fn) {
  return sdb.collection(path).onSnapshot((snap) => { const m = {}; for (const d of snap.docs) m[d.id] = d.data(); fn(m); render(); react(); },
    (e) => log("subscription error on " + path + ": " + e.code));
}

function openGroup(gid) {
  for (const u of unsubGroup) u(); unsubGroup = [];
  closeSession();
  dropChain();
  Object.assign(state, { gid, g: null, seats: {}, dkg1: {}, dkg2: {}, done: {}, verify: {}, wallet: null, sessions: [], log: [] });
  if (!gid) { try { history.replaceState(null, "", "#"); } catch {} render(); return; }
  try { history.replaceState(null, "", "#" + gid); } catch {}
  const base = "groups/" + gid;
  unsubGroup.push(sdb.doc(base).onSnapshot((d) => { state.g = d.exists ? { id: d.id, ...d.data() } : null; render(); react(); }));
  unsubGroup.push(sub(base + "/seats", (m) => state.seats = m));
  unsubGroup.push(sub(base + "/dkg1", (m) => state.dkg1 = m));
  unsubGroup.push(sub(base + "/dkg2", (m) => state.dkg2 = m));
  unsubGroup.push(sub(base + "/done", (m) => state.done = m));
  unsubGroup.push(sub(base + "/verify", (m) => state.verify = m));
  unsubGroup.push(sdb.doc(base + "/meta/wallet").onSnapshot((d) => { state.wallet = d.exists ? d.data() : null; render(); react(); }));
  unsubGroup.push(sub(base + "/sessions", (m) => { state.sessions = Object.entries(m).map(([id, v]) => ({ id, ...v })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); }));
  render();
}

function openSession(sid) {
  closeSession();
  state.sid = sid;
  const base = "groups/" + state.gid + "/sessions/" + sid;
  unsubSession.push(sub(base + "/commits", (m) => state.commits = m));
  unsubSession.push(sub(base + "/shares", (m) => state.shares = m));
  render();
}
function closeSession() { for (const u of unsubSession) u(); unsubSession = []; state.sid = null; state.commits = {}; state.shares = {}; }

// ───────────────────────── Derived state ─────────────────────────
const seatIds = () => state.g ? Array.from({ length: state.g.n }, (_, i) => i + 1) : [];
const allSeated = () => seatIds().every((i) => state.seats[i] && state.seats[i].uid && state.seats[i].boxPk);
const allR1 = () => seatIds().every((i) => state.dkg1[i]);
const r2For = (to) => seatIds().filter((i) => i !== to).every((i) => state.dkg2[i + "-" + to]);
const allDone = () => seatIds().every((i) => state.done[i]);
const keysAgree = () => allDone() && new Set(seatIds().map((i) => state.done[i].groupKey)).size === 1;
const localSeats = () => state.gid ? mySeatSecrets(state.gid).map(([i]) => i).filter((i) => state.seats[i] && state.seats[i].uid === me) : [];
const isCreator = () => state.g && state.g.createdBy === me;
const seatNameOf = (uid) => (Object.values(state.seats).find((s) => s.uid === uid) || {}).name || "someone";
const curSession = () => state.sessions.find((s) => s.id === state.sid) || null;

function seatStage(i) {
  if (!state.seats[i]) return 0;
  if (state.verify[i] && state.verify[i].ok) return 5;
  if (state.done[i]) return 4;
  if (seatIds().filter((j) => j !== i).some((j) => state.dkg2[i + "-" + j])) return 3;
  if (state.dkg1[i]) return 2;
  return 1;
}
const STAGE_LABEL = ["Open seat", "Joined", "Round 1 sent", "Round 2 sent", "Holds key share", "Verified wallet"];

// ───────────────────────── Reactor ─────────────────────────
// Each browser advances the steps it can do for its own seats. Steps that
// need a human decision (approving a spend) wait for a click.
async function once(key, fn) {
  if (busy.has(key)) return; busy.add(key);
  try { await fn(); } catch (e) { log("✗ " + key + ": " + (e && e.message ? e.message : e)); showBanner("bad", (e && e.message) ? e.message : String(e)); }
  finally { busy.delete(key); render(); setTimeout(react, 0); }
}

function react() {
  if (!Z || !db || !state.g) return;
  const g = state.g, gid = state.gid, base = "groups/" + gid;
  for (const i of localSeats()) {
    const s = sec(gid, i);
    // Round 1
    if (!state.dkg1[i] && !s.keyPackage) {
      once("r1:" + i, async () => {
        let secret = s.r1secret, pkg = s.r1package;
        if (!secret) { const r = J(Z.dkgPart1(i, g.n, g.t)); secret = r.secret; pkg = r.package; putSec(gid, i, { r1secret: secret, r1package: pkg }); }
        await sdb.doc(base + "/dkg1/" + i).set({ package: pkg, at: Date.now() });
        log("seat " + i + ": round 1 commitment published");
      });
      continue;
    }
    // Round 2: needs every seat taken (for their encryption keys) and every round-1 package.
    if (s.r1secret && !s.r2secret && !s.keyPackage && allSeated() && allR1()) {
      once("r2:" + i, async () => {
        const r1 = {}; for (const j of seatIds()) if (j !== i) r1[j] = state.dkg1[j].package;
        const r = J(Z.dkgPart2(S(s.r1secret), S(r1)));
        for (const [to, pkg] of Object.entries(r.outgoing)) {
          const sealed = Z.boxSeal(s.boxSk, state.seats[to].boxPk, gid + ":" + i + "->" + to, S(pkg));
          await sdb.doc(base + "/dkg2/" + i + "-" + to).set({ sealed, at: Date.now() });
        }
        putSec(gid, i, { r2secret: r.secret, r1secret: null });
        log("seat " + i + ": " + Object.keys(r.outgoing).length + " encrypted shares sent");
      });
      continue;
    }
    // Round 3 (local): decrypt the shares sent to me, compute my key share.
    if (s.r2secret && !s.keyPackage && allR1() && r2For(i)) {
      once("r3:" + i, async () => {
        const r1 = {}, r2 = {};
        for (const j of seatIds()) if (j !== i) {
          r1[j] = state.dkg1[j].package;
          r2[j] = J(Z.boxOpen(s.boxSk, state.seats[j].boxPk, gid + ":" + j + "->" + i, state.dkg2[j + "-" + i].sealed));
        }
        const r = J(Z.dkgPart3(S(s.r2secret), S(r1), S(r2)));
        putSec(gid, i, { keyPackage: r.key_package, publicKeyPackage: r.public_key_package, groupKey: r.group_key, r2secret: null, r1package: null });
        await sdb.doc(base + "/done/" + i).set({ groupKey: r.group_key, publicKeyPackage: S(r.public_key_package), at: Date.now() });
        log("seat " + i + ": key share ready, group key " + r.group_key.slice(0, 12) + "…");
      });
      continue;
    }
    // Verify the published wallet against my own DKG output.
    if (s.keyPackage && state.wallet && !state.verify[i]) {
      once("verify:" + i, async () => {
        let ok = true, error = null;
        try { Z.walletVerify(S(state.wallet), S(s.publicKeyPackage)); } catch (e) { ok = false; error = e.message || String(e); }
        await sdb.doc(base + "/verify/" + i).set({ ok, error, at: Date.now() });
        log("seat " + i + (ok ? ": wallet verified, ak equals my group key" : ": WALLET REJECTED: " + error));
      });
    }
  }
  if (state.wallet && state.wallet.birthday && localSeats().some((i) => state.verify[i] && state.verify[i].ok)) ensureChain();
  // Group creator builds the shared wallet once all group keys agree.
  if (isCreator() && !state.wallet && keysAgree()) {
    once("wallet", async () => {
      // The wallet snapshot can arrive after the DKG ones; never replace a published wallet.
      if ((await sdb.doc(base + "/meta/wallet").get()).exists) return;
      const birthday = await Z.latestHeight(await pickServer());
      const w = J(Z.walletCreate(state.done[1].publicKeyPackage, g.network || "testnet"));
      await sdb.doc(base + "/meta/wallet").set({ ...w, birthday, at: Date.now() });
      log("wallet created: " + w.address.slice(0, 24) + "…");
    });
  }
  // Signing.
  const ss = curSession();
  if (ss && state.wallet) reactSession(ss);
}

function reactSession(ss) {
  const g = state.g, gid = state.gid, base = "groups/" + gid + "/sessions/" + ss.id;
  const fvk = state.wallet.orchard_fvk;
  const coordinator = ss.createdBy === me;
  // Coordinator: once t approvals are in, build the signing package.
  if (coordinator && !ss.package && !ss.error) {
    const ids = Object.keys(state.commits).map(Number).sort((a, b) => a - b).slice(0, g.t);
    if (ids.length >= g.t) once("pkg:" + ss.id, async () => {
      const c = {}; for (const i of ids) c[i] = state.commits[i].commitments;
      const pkg = Z.signPackage(ss.pczt, fvk, S(c), g.t);
      await sdb.doc("groups/" + gid + "/sessions/" + ss.id).update({ package: pkg, signers: ids, status: "signing" });
      log("signing package sent to signers " + ids.join(", "));
    });
  }
  // Signer: once the package names me, re-verify everything and sign.
  if (ss.package && !ss.error) {
    for (const i of localSeats()) {
      const s = sec(gid, i), n = s.nonces && s.nonces[ss.id];
      if ((ss.signers || []).includes(i) && n && !state.shares[i]) once("share:" + ss.id + ":" + i, async () => {
        const shares = Z.signShare(ss.pczt, fvk, ss.package, S(n.nonces), S(n.commitments), S(s.keyPackage), i);
        const nonces = { ...(s.nonces || {}) }; delete nonces[ss.id]; putSec(gid, i, { nonces });   // burn nonces
        await sdb.doc(base + "/shares/" + i).set({ shares, at: Date.now() });
        log("seat " + i + ": signature share sent");
      });
    }
  }
  // Any participant: aggregate. The result is deterministic, so a race is harmless.
  if (localSeats().length && ss.package && !ss.signed && !ss.error && (ss.signers || []).every((i) => state.shares[i])) {
    once("agg:" + ss.id, async () => {
      const sh = {}; for (const i of ss.signers) sh[i] = J(state.shares[i].shares);
      let r;
      try { r = J(Z.signAggregate(ss.pczt, state.done[1].publicKeyPackage, ss.package, S(sh))); }
      catch (e) { await sdb.doc("groups/" + gid + "/sessions/" + ss.id).update({ error: e.message || String(e), status: "failed" }); throw e; }
      await sdb.doc("groups/" + gid + "/sessions/" + ss.id).update({ signed: r.signed_pczt, signatures: r.signatures, status: "signed" });
      log("signatures aggregated and verified under rk");
    });
  }
}

// ───────────────────────── Actions ─────────────────────────
async function createGroup(name, n, t) {
  const ref = sdb.collection("groups").doc();
  const key = new Uint8Array(32); crypto.getRandomValues(key);
  putKey(ref.id, btoa(String.fromCharCode(...key)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""));
  await ref.set({ name, n, t, network: "testnet", createdBy: me, createdAt: Date.now() });
  openGroup(ref.id);
  await takeSeat(1);
}

async function takeSeat(i) {
  if (!Z) return;
  const ref = sdb.doc("groups/" + state.gid + "/seats/" + i);
  const lease = await ref.acquire({ holder: me || "anon", ttlMs: 5000 });
  if (!lease.acquired) { showBanner("bad", "Someone else is taking seat " + i + " right now."); return; }
  const cur = await ref.get();
  if (cur.exists && cur.data().uid) { showBanner("bad", "Seat " + i + " is already taken."); return; }
  const kp = J(Z.boxKeypair());
  putSec(state.gid, i, { boxSk: kp.sk });
  const name = user ? (await user.me()).name : "";
  await ref.set({ uid: me, name, boxPk: kp.pk, at: Date.now() });
  log("you took seat " + i);
}

function dropChain() { const c = chain; chain = null; if (c && !c.syncing && c.cw) c.cw.free(); }

function ensureChain() {
  if (!Z || (chain && chain.gid === state.gid)) return;
  const w = state.wallet;
  chain = { gid: state.gid, ufvk: w.ufvk, birthday: w.birthday, cw: null, url: null, prog: null, bal: null, ms: 0, error: null, syncing: false };
  runSync(chain);
}

function withTimeout(promise, ms, what) {
  let timer;
  const late = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(what + " did not answer in " + ms / 1000 + " s")), ms); });
  return Promise.race([promise, late]).finally(() => clearTimeout(timer));
}

// Returns the first light-wallet server that answers, in LIGHTWALLETDS order.
async function pickServer() {
  for (const url of LIGHTWALLETDS) {
    try { await withTimeout(Z.latestHeight(url), SERVER_TIMEOUT_MS, new URL(url).host); return url; }
    catch (e) { log(new URL(url).host + " unreachable: " + (e.message || e)); }
  }
  throw new Error("No light-wallet server answers. Check your connection, then click Sync.");
}

// Switching servers starts a new wallet, which syncs again from the birthday.
async function connect(c) {
  const url = await pickServer();
  if (c.cw && c.url === url) return;
  if (c.cw) c.cw.free();
  c.cw = new Z.ChainWallet(c.ufvk, c.birthday, url);
  c.url = url;
  log("using " + new URL(url).host);
}

async function runSync(c) {
  if (c.syncing) return;
  c.syncing = true; c.error = null; render();
  const t0 = performance.now();
  try { await connect(c); c.bal = J(await c.cw.sync((p) => { c.prog = J(p); render(); })); c.prog = null; c.ms = Math.round(performance.now() - t0); log("synced to " + c.bal.height + ", spendable " + fmtZec(c.bal.spendable)); }
  catch (e) { c.error = e.message || String(e); log("sync failed: " + c.error); }
  finally { c.syncing = false; if (chain !== c && c.cw) c.cw.free(); render(); }
}

async function newSpend(recipient, amountZat) {
  if (!chain || chain.gid !== state.gid || !chain.bal) throw new Error("The wallet has not finished its first sync.");
  const t = J(await chain.cw.createSpend(recipient, amountZat));
  const ref = sdb.collection("groups/" + state.gid + "/sessions").doc();
