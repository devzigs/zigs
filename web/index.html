<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zigs</title>
<meta name="description" content="Zigs is a private shared wallet for shielded Zcash. Any t of n signers approve each payment, and on chain it looks like a shielded payment from a standard wallet.">
<link rel="modulepreload" href="/pkg/zigs_engine.js">
<link rel="preload" href="/pkg/zigs_engine_bg.wasm" as="fetch" type="application/wasm" crossorigin>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="/app.css">

<div class="shell">
  <aside class="side" aria-label="Wallets">
    <a class="logo" href="#" aria-label="Zigs home">
      <img src="/logo.png" alt="" width="28" height="28">
      Zigs
      <span class="net" title="Beta: testnet, and mainnet with a warning at 0.5 ZEC. Not audited.">Beta</span>
    </a>
    <nav id="side-nav" aria-label="Your wallets and chats"></nav>
    <div class="side-foot">
      <div class="engine" id="engine"><span class="dot busy" id="engine-dot"></span><span id="engine-text">Loading crypto engine…</span></div>
      <p class="side-note">Keys are made and used in this browser. Beta: testnet, and mainnet with
        a warning at 0.5 ZEC. Not audited. At 0.5 ZEC the app warns and hides the address. It cannot block
        deposits.
        <a href="https://zigs.app" target="_blank" rel="noopener">About Zigs</a></p>
    </div>
  </aside>
  <main class="main"><div id="app" class="page"></div></main>
</div>
<div id="banner" hidden role="status"><span id="banner-text"></span>
  <button class="icon-btn" id="banner-close" type="button" aria-label="Close">×</button></div>
<noscript><p class="notice bad">Zigs needs JavaScript and WebAssembly.
  In Tor Browser, set the security level to Standard.</p></noscript>

<script type="module" src="/app.js"></script>
