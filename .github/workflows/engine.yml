# The Zcash engine: the CLI end-to-end test of the root crate and the tests of wasm/ (VEL-5).
# Runs only when their files change. No secret is used.
name: engine

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - wasm/**
      - .github/workflows/engine.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - wasm/**
      - .github/workflows/engine.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # A newer push to a branch cancels the stale run; every commit of main keeps its run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            wasm/target
          key: engine-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', 'wasm/Cargo.lock') }}
          restore-keys: engine-${{ steps.rust.outputs.version }}-
      - name: Root crate (the CLI and its end-to-end ceremony with attacks)
        run: |
          cargo build --release --locked
          bash tests/e2e.sh
      - name: wasm/
        working-directory: wasm
        run: cargo test --release --locked
