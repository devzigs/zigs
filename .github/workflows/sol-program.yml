# The Solana approvals program: `build.sh test` builds the Devnet ELF and checks its Linux hash,
# checks the cluster builds, builds the pool of the pinned Zolana commit, and runs the unit and
# LiteSVM tests (VEL-5). Runs only when its files change.
name: sol-program

on:
  push:
    paths:
      - sol-program/**
      - .github/workflows/sol-program.yml
  pull_request:
    paths:
      - sol-program/**
      - .github/workflows/sol-program.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # A newer push to a branch cancels the stale run; every commit of main keeps its run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache Agave v4.3.0 and platform-tools v1.54
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/agave
            ~/.cache/solana/v1.54
          key: sbf-agave-4.3.0-platform-tools-v1.54
      - name: Agave v4.3.0 (the release archive, checked by its SHA-256)
        run: |
          if [ ! -x "$HOME/agave/solana-release/bin/cargo-build-sbf" ]; then
            name=solana-release-x86_64-unknown-linux-gnu.tar.bz2
            curl -sSfL -o "$RUNNER_TEMP/$name" \
              "https://github.com/anza-xyz/agave/releases/download/v4.3.0/$name"
            echo "c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8  $RUNNER_TEMP/$name" \
              | sha256sum -c -
            mkdir -p "$HOME/agave"
            tar -xjf "$RUNNER_TEMP/$name" -C "$HOME/agave"
          fi
          echo "CARGO_BUILD_SBF=$HOME/agave/solana-release/bin/cargo-build-sbf" >> "$GITHUB_ENV"
      - name: Cache the cargo builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            sol-program/target
            sol-program/svm-tests/target
          key: sol-program-${{ steps.rust.outputs.version }}-${{ hashFiles('sol-program/Cargo.lock', 'sol-program/svm-tests/Cargo.lock') }}
          restore-keys: sol-program-${{ steps.rust.outputs.version }}-
      - name: Build and test
        run: sh sol-program/build.sh test
      # The unstripped Linux ELF, to compare its code with the macOS build (sol-program/fncmp.py).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zigs_min_multisig-linux-unstripped
          path: sol-program/target/sbpf-solana-solana/release/zigs_min_multisig.so
          retention-days: 7
