# solspike/lint.sh (VEL-9): oxlint at the version of solspike/package-lock.json, the limits for
# Python and the line limit, on the page modules, the Solana files and the tools.
name: lint

on:
  push:
    paths:
      - web/**
      - solspike/**
      - .github/workflows/lint.yml
  pull_request:
    paths:
      - web/**
      - solspike/**
      - .github/workflows/lint.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: oxlint from the lockfile
        run: npm ci --prefix solspike --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: bash solspike/lint.sh
